name: build

# Builds the netbench server (memserve), the client (membench), the Docker images
# (memserve, samba, clients), smoke-tests server + client on Linux, and attaches
# the standalone binaries to a GitHub release for v* tags.
#
# Artifacts: membench-<rid>, memserve-<rid>. Images: ghcr.io/<owner>/<repo>/<image>.
# See docs/USAGE.md for the short usage guide.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # ---------------------------------------------------------------- client binaries
  membench:
    name: membench (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish src/MemBench/MemBench.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o dist/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: membench-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- server binary
  memserve:
    name: memserve (${{ matrix.rid }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Zero-copy and kernel TLS are Linux-only; the Windows builds use the portable copy path.
        rid: [linux-x64, linux-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish src/MemServe/MemServe.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o dist/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: memserve-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- server + client smoke test
  smoke:
    name: smoke test (server + client)
    needs: [membench, memserve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memserve-linux-x64
          path: bin/memserve

      - uses: actions/download-artifact@v4
        with:
          name: membench-linux-x64
          path: bin/membench

      - name: Start memserve, download, upload and benchmark
        run: |
          set -euo pipefail
          chmod +x bin/memserve/memserve bin/membench/membench

          bin/memserve/memserve --http-port 8088 --no-https --no-ftp --backing 64M > memserve.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8088/health

          # the virtual 10M file must deliver exactly 10 MiB
          size=$(curl -fsS -o /dev/null -w '%{size_download}' http://127.0.0.1:8088/10M)
          test "$size" = "10485760"
          echo "HTTP download: $size bytes"

          # upload sink
          head -c 1048576 /dev/zero | curl -fsS -X POST --data-binary @- http://127.0.0.1:8088/upload 2>/dev/null || true

          # real client run against the real server; exits 1 when nothing was transferred
          bin/membench/membench http://127.0.0.1:8088/ -c 2 -t 2 -w 1 --no-stats

          # /stats must be valid JSON
          curl -fsS http://127.0.0.1:8088/stats | python3 -c 'import json,sys; json.load(sys.stdin)'

      - name: Server log
        if: failure()
        run: cat memserve.log

  # ---------------------------------------------------------------- Windows server + client smoke test
  smoke-windows:
    name: smoke test (Windows server + client)
    needs: [membench, memserve]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memserve-win-x64
          path: bin/memserve

      - uses: actions/download-artifact@v4
        with:
          name: membench-win-x64
          path: bin/membench

      - name: Run memserve.exe and membench.exe
        shell: pwsh
        run: |
          $server = Join-Path $PWD "bin\memserve\memserve.exe"
          $client = Join-Path $PWD "bin\membench\membench.exe"
          $srv = Start-Process -FilePath $server `
            -ArgumentList @("--http-port", "8088", "--https-port", "8443", "--no-ftp", "--backing", "64M") `
            -PassThru -RedirectStandardOutput "memserve.log" -RedirectStandardError "memserve.err"
          try {
            $ready = $false
            for ($i = 0; $i -lt 100; $i++) {
              if ($srv.HasExited) { throw "memserve exited with code $($srv.ExitCode)" }
              try {
                $health = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8088/health" -TimeoutSec 1
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 100 }
            }
            if (-not $ready) { throw "memserve did not listen on :8088" }

            $file = Join-Path $env:RUNNER_TEMP "10M.bin"
            Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8088/10M" -OutFile $file
            $len = (Get-Item $file).Length
            if ($len -ne 10485760) { throw "expected 10485760 bytes, got $len" }
            Write-Host "HTTP download: $len bytes"

            & $client "http://127.0.0.1:8088/" -c 2 -t 2 -w 1 --no-stats
            if ($LASTEXITCODE -ne 0) { throw "membench HTTP exited with code $LASTEXITCODE" }

            & $client "https://127.0.0.1:8443/" -k -c 1 -t 1 -w 0 --no-stats
            if ($LASTEXITCODE -ne 0) { throw "membench HTTPS exited with code $LASTEXITCODE" }

            $null = Invoke-RestMethod -Uri "http://127.0.0.1:8088/stats" -TimeoutSec 5
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
            Write-Host "--- memserve.log ---"
            Get-Content memserve.log -ErrorAction SilentlyContinue
            Write-Host "--- memserve.err ---"
            Get-Content memserve.err -ErrorAction SilentlyContinue
          }

  # ---------------------------------------------------------------- docker images
  docker:
    name: docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: memserve
            context: .
            file: docker/memserve/Dockerfile
          - image: clients
            context: .
            file: docker/clients/Dockerfile
          - image: samba
            context: docker/samba
            file: docker/samba/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix
        id: prefix
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.prefix.outputs.prefix }}/${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------- release assets
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [membench, memserve]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Download by pattern: "all artifacts" also picks up the docker buildx cache
      # entries (XCisCoX~network-bench~*.dockerbuild), which have no downloadable archive.
      - uses: actions/download-artifact@v4
        with:
          pattern: membench-*
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: memserve-*
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release
          copy_binaries() {
            program=$1
            for d in artifacts/${program}-*; do
              rid=${d#artifacts/${program}-}
              for f in "$d"/*; do
                case "$f" in
                  *.exe) cp "$f" "release/netbench-${program}-${rid}.exe" ;;
                  *)     cp "$f" "release/netbench-${program}-${rid}" ;;
                esac
                break
              done
            done
          }
          copy_binaries membench
          copy_binaries memserve
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
